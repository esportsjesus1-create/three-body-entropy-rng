name: CI

on:
  push:
    branches: [main, 'devin/**']
  pull_request:
    branches: [main, 'devin/**']

jobs:
  dependency-checks:
    name: Dependency Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Check for circular dependencies
        run: npm run check:deps

      - name: Check architecture rules
        run: npm run check:architecture
        continue-on-error: true  # Warn but don't fail initially

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-b2b
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-b2b/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests (if configured)
        run: npm run test --if-present

      - name: Build
        run: npm run build

  module-checks:
    name: Module Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - physics-engine
          - hash-chain
          - theta-protection
          - session-state-machine
          - entropy-oracle
          - integration-examples
          - shared-types
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install module dependencies
        working-directory: modules/${{ matrix.module }}
        run: npm install

      - name: Build module
        working-directory: modules/${{ matrix.module }}
        run: npm run build --if-present
        continue-on-error: true  # Some modules have pre-existing build issues

      - name: Run module tests
        working-directory: modules/${{ matrix.module }}
        run: npm run test --if-present
        continue-on-error: true  # Some modules may not have tests yet
