name: Entropy Quality Tests

on:
  push:
    branches: [main, 'devin/**']
  pull_request:
    branches: [main, 'devin/**']

jobs:
  entropy-quality-tests:
    name: Entropy Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Install entropy-oracle dependencies
        working-directory: modules/entropy-oracle
        run: npm install

      - name: Install shared-types dependencies
        working-directory: modules/shared-types
        run: npm install

      - name: Run entropy quality tests
        working-directory: tests
        run: npx vitest run entropy-quality/entropy-quality.test.ts --reporter=verbose
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entropy-quality-results
          path: tests/coverage/
          retention-days: 7

  entropy-quality-extended:
    name: Extended Entropy Quality Tests (10000 samples)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Install entropy-oracle dependencies
        working-directory: modules/entropy-oracle
        run: npm install

      - name: Install shared-types dependencies
        working-directory: modules/shared-types
        run: npm install

      - name: Run extended entropy quality tests
        working-directory: tests
        run: npx vitest run entropy-quality/entropy-quality.test.ts --reporter=verbose --testNamePattern="Extended"
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
