[tool.poetry]
name = "physics-engine"
version = "1.0.0"
description = "Three-body RK4 physics simulation for deterministic entropy generation"
authors = ["Three-Body RNG Team"]
readme = "README.md"
packages = [{include = "physics_engine", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.poetry.scripts]
physics-cli = "physics_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=physics_engine --cov-report=term-missing --cov-fail-under=90"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
