[tool.poetry]
name = "seed-chain"
version = "1.0.0"
description = "Pre-committed seed chain to prevent seed grinding attacks in Three-Body RNG"
authors = ["Three-Body RNG Team"]
readme = "README.md"
packages = [{include = "seed_chain", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=seed_chain --cov-report=term-missing --cov-fail-under=90"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
